# All ecosystems run Monday 04:00 Pacific so PRs are open before the Monday dashboard email.
# Each entry waits 7 days after a release (cooldown), so that a bad or compromised release can be found before Dependabot opens a PR for it.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # The requirements files use >= ranges. Open a PR only when a new version
    # is outside the range, not to raise a floor.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patch:
        dependency-type: "production"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
